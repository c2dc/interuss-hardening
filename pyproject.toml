[project]
name = "monitoring"
dynamic = ["version"]
authors = [
  { name="InterUSS Platform", email="tsc@lists.interussplatform.org" },
]
description = "Monitoring framework to test UAS Service Suppliers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "arrow>=1.4.0",
    "asteval>=1.0.9",
    "bc-jsonpath-ng>=1.6.1",
    "cryptography>=50.0.0",
    "deprecation>=2.1.0",
    "faker>=40.36.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "geojson>=3.3.0",
    "gevent>=26.8.0",
    "google-auth>=2.56.3",
    "gunicorn>=26.1.0",
    "implicitdict>=4.1.0",
    "jsonnet>=0.22.0",
    "jsonschema>=4.26.0",
    "jwcrypto>=1.5.8",
    "loguru>=0.7.3",
    "lxml>=6.1.2",
    "marko>=2.2.4",
    "numpy>=2.5.2",
    "oauthlib>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pvlib>=0.15.2",
    "pyjwt>=2.13.0",
    "pykml>=0.2.0",
    "pyopenssl>=26.4.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "s2sphere>=0.2.5",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "termcolor>=3.3.0",
    "uas-standards>=4.4.0",
    "uuid6>=2025.0.1",
]

[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = { uas-standards = false }

[build-system]
requires = [
  "setuptools>=84.0.0",
  "wheel>=0.48.0",               # for bdist package distribution
  "setuptools_scm>=10.2.1", # for automated versioning
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = { "monitoring" = "monitoring" }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "monitoring.mock_uss*",
  "monitoring.monitorlib*",
  "monitoring.prober*",
  "monitoring.uss_qualifier*",
  "monitoring._version.py"
]
namespaces = true

[tool.setuptools_scm]
write_to = "monitoring/_version.py"
tag_regex = "^interuss/monitoring/v(?P<version>\\d+\\.\\d+\\.\\d+)"


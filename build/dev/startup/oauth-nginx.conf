# mTLS-terminating front for the token endpoint (the `oauth` service).
# Rendered at container start: the `oauth` service substitutes __PROXY_SECRET__
# (from /secrets/oauth/proxy_secret) into this template and writes the result to
# /etc/nginx/conf.d/default.conf before starting nginx. The signer sits on an
# internal-only network (oauth_backend_network) reachable only from this front;
# the shared secret is defense in depth so a token cannot be minted without
# traversing this mTLS front.

server {
    listen 8443 ssl;
    server_name oauth.authority.localutm;

    ssl_certificate     /secrets/oauth/server.crt;
    ssl_certificate_key /secrets/oauth/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Client certs are verified against the OpenBao CA when presented;
    # enforcement is per-location (JWKS is public, /token is not).
    ssl_client_certificate /secrets/oauth/clients/ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # Public: core-service (-jwks_endpoint) and mock_uss fetch this without a cert.
    location = /.well-known/jwks.json {
        proxy_pass http://oauth-signer:8081;
    }

    # Token issuance: mutual TLS required. The verified client identity is passed
    # to the signer, which uses the CN as the token `sub`. The client cert itself
    # is also forwarded so the signer can bind the token to it (RFC 8705 `cnf`).
    location = /token {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-CN     $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
        # Proves to the signer that this request came through this front.
        proxy_set_header X-Proxy-Auth        "__PROXY_SECRET__";
        proxy_pass http://oauth-signer:8081;
    }

    # RFC 8705 checker, relayed for the DSS TLS fronts. The signer is no longer
    # on the ecosystem network, so the DSS (core_service.sh, auth_request) can no
    # longer reach it directly; it calls this location instead, forwarding the
    # end-user's presented client cert (X-SSL-Client-Cert) and bearer token
    # (Authorization), which we pass through unchanged. No client cert of its own
    # is required for this internal, read-only check.
    location = /verify-cnf {
        proxy_pass http://oauth-signer:8081/verify-cnf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-SSL-Client-Cert $http_x_ssl_client_cert;
    }

    location / { return 404; }
}

# Shared infrastructure for the local ecosystem, project `local_infra_secrets`,
# brought up by run_locally.sh BEFORE the per-USS stacks (mirroring how the shared
# external networks are created up front):
#
#   * openbao / openbao-init — the vault. Owns the CockroachDB cluster CA (private
#     key never leaves the process) and the static secrets (OAuth signing key,
#     message-signing keypair, MinIO credentials). Provisions everything into
#     build/dev/dss-secrets/ which the per-USS services bind-mount read-only.
#   * minio / minio-init — the WORM log store. S3 Object Lock, COMPLIANCE / 3 days,
#     default SSE-S3 encryption at rest (vault-issued KMS master key).
#   * vector — ships every container's logs (read-only Docker socket) into MinIO.
#   * log-chainer — periodically checkpoints the WORM bucket into a hash chain
#     (logs/checkpoints/), so the log sequence's completeness/order is provable
#     independent of trusting MinIO's own bookkeeping.
#
# `run_locally.sh down` runs `docker compose ... down --volumes`, so minio_data and
# vector_buffer are destroyed on teardown even though the objects are WORM-locked
# (Object Lock is enforced by the running MinIO process, not the filesystem).

# Bound each container's stdout/stderr capture (Docker json-file driver).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  openbao:
    image: openbao/openbao:2.6.2
    logging: *default-logging
    container_name: local_infra_secrets-openbao-1
    cap_add: [IPC_LOCK]
    hostname: vault.localutm
    restart: always
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://vault.localutm:8200
    networks:
      - dss_internal_network
    ports:
      # Host-local only, for `bao` CLI / UI against the dev server.
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  openbao-init:
    image: openbao/openbao:2.6.2
    logging: *default-logging
    container_name: local_infra_secrets-openbao-init-1
    # root so the init script can `apk add jq`
    user: "0:0"
    entrypoint: ["sh", "/startup/openbao-init.sh"]
    environment:
      BAO_ADDR: http://vault.localutm:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      NUM_USS: ${NUM_USS:-2}
      NUM_NODES: ${NUM_NODES:-1}
    volumes:
      - $PWD/startup/openbao-init.sh:/startup/openbao-init.sh:ro
      - $PWD/../test-certs:/seed:ro
      - $PWD/dss-secrets:/secrets
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - dss_internal_network

  # ---------------------------------------------------------------------------
  # WORM log store
  # ---------------------------------------------------------------------------
  minio:
    image: local/minio:RELEASE.2025-07-23T15-54-02Z
    # Built locally from source (minio/Dockerfile): MinIO no longer publishes
    # pullable images or binaries. `never` builds when the image is missing
    # instead of first trying (and failing) to pull it.
    pull_policy: never
    build:
      context: ./minio
      target: minio
      network: host
    logging: *default-logging
    container_name: local_infra_secrets-minio-1
    hostname: minio.localutm
    restart: always
    # TLS cert + root credentials come from the vault (materialised by openbao-init).
    command: server --certs-dir /certs /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
      # Static single-key KMS (data-at-rest encryption): the key comes from the
      # vault (openbao-init.sh -> secret/minio); minio-init.sh turns on default
      # SSE-S3 bucket encryption once this key is registered.
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
    volumes:
      - $PWD/dss-secrets/minio/root_user:/run/secrets/minio_root_user:ro
      - $PWD/dss-secrets/minio/root_password:/run/secrets/minio_root_password:ro
      - $PWD/dss-secrets/minio/kms_key:/run/secrets/minio_kms_key:ro
      - $PWD/dss-secrets/minio/public.crt:/certs/public.crt:ro
      - $PWD/dss-secrets/minio/private.key:/certs/private.key:ro
      - $PWD/dss-secrets/minio/ca.crt:/certs/CAs/vault-ca.crt:ro
      - minio_data:/data
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    networks:
      - dss_internal_network
    # Private network only. For host access add: ports: ["127.0.0.1:9000:9000"]

  minio-init:
    image: local/mc:RELEASE.2025-07-21T05-28-08Z
    # Built locally from source (minio/Dockerfile): MinIO no longer publishes
    # pullable images or binaries. `never` builds when the image is missing
    # instead of first trying (and failing) to pull it.
    pull_policy: never
    build:
      context: ./minio
      target: mc
      network: host
    logging: *default-logging
    container_name: local_infra_secrets-minio-init-1
    user: "0:0"
    entrypoint: ["sh", "/startup/minio-init.sh"]
    volumes:
      - $PWD/startup/minio-init.sh:/startup/minio-init.sh:ro
      # read-write: minio-init writes Vector's effective credentials back here
      - $PWD/dss-secrets/minio:/secrets/minio
    depends_on:
      minio:
        condition: service_started
    networks:
      - dss_internal_network

  vector:
    image: timberio/vector:0.48.0-alpine
    logging: *default-logging
    container_name: local_infra_secrets-vector-1
    hostname: vector.localutm
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export AWS_ACCESS_KEY_ID="$$(cat /secrets/minio/vector_key)"; export AWS_SECRET_ACCESS_KEY="$$(cat /secrets/minio/vector_secret)"; exec vector --config /etc/vector/vector.toml'
    volumes:
      - $PWD/startup/vector.toml:/etc/vector/vector.toml:ro
      - $PWD/dss-secrets/minio:/secrets/minio:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # mock_uss's structured ASTM interaction records, read-only. run_locally.sh
      # must create this directory BEFORE this project starts — the mock fleet
      # comes up much later, so otherwise Docker creates the mount source as root.
      - $PWD/../../monitoring/mock_uss/output:/mock-interactions:ro
      - vector_buffer:/var/lib/vector
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - dss_internal_network
    healthcheck:
      # 127.0.0.1, not localhost: the Vector API binds IPv4 only and busybox wget
      # would try ::1 first.
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "-", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  log-chainer:
    image: local/mc:RELEASE.2025-07-21T05-28-08Z
    # Built locally from source (minio/Dockerfile): MinIO no longer publishes
    # pullable images or binaries. `never` builds when the image is missing
    # instead of first trying (and failing) to pull it.
    pull_policy: never
    build:
      context: ./minio
      target: mc
      network: host
    logging: *default-logging
    container_name: local_infra_secrets-log-chainer-1
    restart: always
    entrypoint: ["sh", "/startup/log_chainer.sh"]
    volumes:
      - $PWD/startup/log_chainer.sh:/startup/log_chainer.sh:ro
      - $PWD/dss-secrets/minio:/secrets/minio:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - dss_internal_network

networks:
  dss_internal_network:
    name: dss_internal_network
    external: true

volumes:
  # Project-scoped: removed by `docker compose down --volumes` (run_locally.sh down).
  minio_data:
  vector_buffer:

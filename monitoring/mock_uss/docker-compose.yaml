# Full suite of mock_uss instances, capable of serving all local uss_qualifier tests.
# Requires the interoperability ecosystem that can be brought up with build/dev/run_locally.sh

# Bound the size of every container's stdout/stderr capture (Docker json-file
# driver). Without this each *-json.log grows unbounded until the container is
# removed. 10m x 3 = 30 MiB per container. Matches the anchor of the same name
# in build/dev/docker-compose.yaml and build/dev/docker-compose.secrets.yaml.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  mock_uss_scdsc_a:
    container_name: mock_uss_scdsc_a
    hostname: scdsc.uss1.localutm
    logging: *default-logging
    image: interuss/monitoring
    pull_policy: never
    command: mock_uss/start.sh
    environment:
      - MOCK_USS_AUTH_SPEC=DummyOAuth(https://oauth.authority.localutm:8443/token,uss1)
      - MOCK_USS_DSS_URL=https://dss1.uss1.localutm
      - MOCK_USS_PUBLIC_KEY=https://oauth.authority.localutm:8443/.well-known/jwks.json
      - MOCK_USS_TLS_CERT=/secrets/mock-tls/scdsc.uss1.localutm/server.crt
      - MOCK_USS_TLS_KEY=/secrets/mock-tls/scdsc.uss1.localutm/server.key
      - REQUESTS_CA_BUNDLE=/secrets/oauth/clients/ca.crt
      - AUTH_ADAPTER_CERT_DIR=/secrets/oauth/clients
      - MOCK_USS_TOKEN_AUDIENCE=scdsc.uss1.localutm,localhost,host.docker.internal
      - MOCK_USS_BASE_URL=https://scdsc.uss1.localutm
      # TODO: remove interaction_logging once dedicated mock_uss is involved in tests
      - MOCK_USS_SERVICES=scdsc,versioning,interaction_logging,flight_planning
      - MOCK_USS_INTERACTIONS_LOG_DIR=output/scdsc_a_interaction_logs
      - MOCK_USS_PORT=443
      - MOCK_USS_PROXY_VALUES=x_for=1,x_proto=1,x_host=1,x_prefix=1,x_port=1
    expose:
      - 443
    ports:
      - 8074:443
    volumes:
      - ../../build/test-certs:/var/test-certs:ro
      - ../../build/dev/dss-secrets:/secrets:ro
      - ./output/scdsc_a_interaction_logs:/app/monitoring/mock_uss/output/scdsc_a_interaction_logs
    user: "${UID_GID}"
    restart: always
    networks:
      - interop_ecosystem_network
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      start_period: 30s
    profiles:
      - '' # starts when no profile is provided
      - scd

